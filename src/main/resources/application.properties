# ==============================
# إعدادات السيرفر
# ==============================
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ==============================
# قاعدة البيانات
# ==============================
# H2 محليًا افتراضيًا، أو PostgreSQL لو متغيرات البيئة دي موجودة (زي على Railway)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/librarydb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT
# ==============================
# مهم: غيّر السطر ده لقيمة سرية طويلة وعشوائية بتاعتك قبل أي نشر حقيقي.
# لازم يكون على الأقل 32 حرف (256 بت) عشان خوارزمية HS256.
jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyForLibraryApiProject2026}
# صلاحية التوكن: 24 ساعة (بالمللي ثانية)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
